name: Rotate Prompt

on:
  schedule:
    # Run every 90 minutes (can't do exact 90 min in cron, so using closest: every 1.5 hours)
    # This runs at minute 0 and 30 of hours 0,3,6,9,12,15,18,21
    - cron: '0 0,3,6,9,12,15,18,21 * * *'
    - cron: '30 1,4,7,10,13,16,19,22 * * *'
  workflow_dispatch:  # Allow manual trigger
    inputs:
      use_bad_prompt:
        description: 'Use bad prompt (for testing CI/CD blocking)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  workflow_call:  # Allow other workflows to call this
    inputs:
      use_bad_prompt:
        description: 'Use bad prompt (for testing CI/CD blocking)'
        required: false
        default: 'false'
        type: string

jobs:
  rotate:
    runs-on: ubuntu-latest
    environment: cicd
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ARIZE_SPACE_ID: ${{ secrets.ARIZE_SPACE_ID }}
      ARIZE_API_KEY: ${{ secrets.ARIZE_API_KEY }}
      ARIZE_DATASET_ID: ${{ secrets.ARIZE_DATASET_ID }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Rotate prompt
      run: |
        if [ "${{ inputs.use_bad_prompt }}" = "true" ]; then
          python rotate_prompt.py --bad
        else
          python rotate_prompt.py
        fi

    - name: Run benchmark (blocks push if fails)
      run: python benchmark.py

    - name: Commit and push changes (only runs if benchmark passed)
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add prompts/rag_prompt.py .prompt_state.json
        git diff --staged --quiet || git commit -m "🔄 Auto-rotate prompt variant"
        git push

