name: Rotate Prompt

on:
  schedule:
    # Run every 90 minutes (can't do exact 90 min in cron, so using closest: every 1.5 hours)
    # This runs at minute 0 and 30 of hours 0,3,6,9,12,15,18,21
    - cron: '0 0,3,6,9,12,15,18,21 * * *'
    - cron: '30 1,4,7,10,13,16,19,22 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  rotate:
    runs-on: ubuntu-latest
    environment: cicd
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Rotate prompt
      run: python rotate_prompt.py

    - name: Commit and push changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add prompts/rag_prompt.py .prompt_state.json
        git diff --staged --quiet || git commit -m "🔄 Auto-rotate prompt variant"
        git push

